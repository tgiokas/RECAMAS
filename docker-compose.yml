version: "3.9"

# Stub for this skeleton commit — only RECAMAS's own API + DB.
# The 4 reused microservices (Authentication, Storage, Notifications, AuditLog)
# each have their own docker-compose.yml in their own repos. Once we're ready
# to run everything together, either:
#   (a) `docker compose -f docker-compose.yml -f ../authentication/docker-compose.yml ...`, or
#   (b) a top-level "platform" compose file that includes all repos via `include:`
# Not decided yet — open item.

services:
  recamas-db:
    image: postgres:18
    container_name: recamas-db
    environment:
      POSTGRES_DB: recamas_dev
      POSTGRES_USER: recamas_app
      POSTGRES_PASSWORD: dev_password_only
    # Uses fixed values above rather than .env's RECAMAS_DB_CONNECTION (a full
    # connection string, not discrete POSTGRES_* vars) — keep the two in sync by hand.
    ports:
      - "5433:5432" # offset from default so it doesn't collide with Authentication's own Postgres locally
    volumes:
      - recamas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recamas_app -d recamas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  recamas-api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: recamas-api
    depends_on:
      recamas-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides .env's RECAMAS_DB_CONNECTION host/port for the compose network
      # (host machine's .env points at localhost, not the recamas-db container).
      RECAMAS_DB_CONNECTION: "Host=recamas-db;Port=5432;Database=recamas_dev;Username=recamas_app;Password=dev_password_only"
      # KEYCLOAK_AUTHORITY / STORAGE_BASE_URL / KAFKA_BOOTSTRAP_SERVERS and the rest
      # come from .env — point them at the reused services' own compose network
      # once composed together.
    ports:
      - "5040:8080"

volumes:
  recamas_db_data:
