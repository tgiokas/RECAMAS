services:
  recamas-db:
   image: postgres:18
   container_name: recamas-db
   environment:
    POSTGRES_DB: recamas-dev
    POSTGRES_USER: recamas-app
    POSTGRES_PASSWORD: dev_password_only
   ports:
    - "5433:5432"
   volumes:
    - recamas-db-data:/var/lib/postgresql
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U recamas-app -d recamas-dev"]
    interval: 5s
    timeout: 5s
    retries: 5

  recamas-api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
      secrets:
        - nuget_token
    container_name: recamas-api
    depends_on:
      recamas-db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5041:8080"

