# Κατάλογος ενεργειών που επιτρέπεται να καταγράψει το RECAMAS.
#
# Κανόνες:
#   - Οι κωδικοί είναι append-only. Ποτέ μετονομασία, ποτέ επαναχρησιμοποίηση.
#   - retention: legal = 7 έτη | standard = 2 έτη
#   - Κάθε κωδικός θέλει μετάφραση σε el και en πριν το merge.
#
# Τα .CREATED / .UPDATED / .DELETED παράγονται αυτόματα από τον interceptor για κάθε
# entity με [Audited]. Τα υπόλοιπα θέλουν ρητή κλήση IAuditRecorder.

# ─── Πρόσβαση ────────────────────────────────────────────────────────────────────────

- code: TCNPROFILE.CREATED
  category: TCN Profile
  severity: high
  requiresTarget: true
  retention: legal

- code: TCNPROFILE.UPDATED
  category: TCN Profile
  severity: medium
  requiresTarget: true
  retention: legal

- code: TCNPROFILE.DELETED
  category: TCN Profile
  severity: high
  requiresTarget: true
  retention: legal
