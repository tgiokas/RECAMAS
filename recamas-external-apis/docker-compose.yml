name: recamas-external-apis
services:
  # ─────────────────────────────────────────────
  # Shared PostgreSQL database
  # All 4 APIs share ONE database, each with its
  # own table (ars_records, cass_records, etc.)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: recamas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recamas_interfaces
      POSTGRES_USER: recamas
      POSTGRES_PASSWORD: recamas_pass
    ports:
      # Host port 5434 -> PostgreSQL's internal container port 5432.
      # Services in this Compose stack connect through `postgres:5432`.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recamas -d recamas_interfaces"]
      interval: 5s
      timeout: 5s
      retries: 10

  database-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: recamas
      PGPASSWORD: recamas_pass
      DATABASES: recamas_ars recamas_cass recamas_arrivals recamas_stoplist
    volumes:
      - ./docker/ensure-databases.sh:/scripts/ensure-databases.sh:ro
    command: ["sh", "/scripts/ensure-databases.sh"]

  # ─────────────────────────────────────────────
  # ARS API  — port 5001
  # Alien Registration System (§9.2)
  # Swagger: http://localhost:5001
  # ─────────────────────────────────────────────
  ars-api:
    build:
      context: .
      dockerfile: src/ArsApi/WebApi/Dockerfile
    container_name: recamas_ars
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=recamas_ars;Username=recamas;Password=recamas_pass"
      Security__ApiKey: "${ARS_API_KEY:-development-ars-api-key}"
    ports:
      - "5001:8080"

  # ─────────────────────────────────────────────
  # CASS API  — port 5002
  # Cyprus Asylum Service (§9.3)
  # Swagger: http://localhost:5002
  # ─────────────────────────────────────────────
  cass-api:
    build:
      context: .
      dockerfile: src/CassApi/WebApi/Dockerfile
    container_name: recamas_cass
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=recamas_cass;Username=recamas;Password=recamas_pass"
      Security__ApiKey: "${CASS_API_KEY:-development-cass-api-key}"
      Security__ClientId: "${UAT_CLIENT_ID:-recamas-development}"
    ports:
      - "5002:8080"

  # ─────────────────────────────────────────────
  # Arrivals/Departures API  — port 5003
  # Police Database — movement history (§9.4)
  # Swagger: http://localhost:5003
  # ─────────────────────────────────────────────
  arrivals-api:
    build:
      context: .
      dockerfile: src/ArrivalsApi/WebApi/Dockerfile
    container_name: recamas_arrivals
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=recamas_arrivals;Username=recamas;Password=recamas_pass"
      Security__ApiKey: "${POLICE_API_KEY:-development-police-api-key}"
      Security__ClientId: "${UAT_CLIENT_ID:-recamas-development}"
    ports:
      - "5003:8080"

  # ─────────────────────────────────────────────
  # Stoplist API  — port 5004
  # Police Database — entry-ban register (§9.5)
  # Swagger: http://localhost:5004
  # ─────────────────────────────────────────────
  stoplist-api:
    build:
      context: .
      dockerfile: src/StoplistApi/WebApi/Dockerfile
    container_name: recamas_stoplist
    restart: unless-stopped
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=recamas_stoplist;Username=recamas;Password=recamas_pass"
      Security__ApiKey: "${POLICE_API_KEY:-development-police-api-key}"
      Security__ClientId: "${UAT_CLIENT_ID:-recamas-development}"
    ports:
      - "5004:8080"

  police-gateway:
    image: nginx:1.27-alpine
    container_name: recamas_police_gateway
    depends_on:
      - arrivals-api
      - stoplist-api
    volumes:
      - ./docker/police-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5005:8080"

volumes:
  postgres_data:
