# RECAMAS action code catalog for Cbs.Audit (see architecture decision log on
# adopting Cbs.Audit as a package). Append-only, matching the convention
# documented in Cbs.Audit.Policy.ActionCatalog's own doc comment: codes are
# never renamed or reused once shipped.
#
# Schema verified against the real source (Cbs.Audit.Policy.ActionDefinition +
# ActionCatalog.LoadFromYaml, and cosmos-business-systems/cbs-audit's own
# docs/ekee-actions.proposed.yaml example): a YAML LIST of entries, each with
# code/category/severity/requiresTarget/retention (camelCase field names —
# ActionCatalog deserializes with CamelCaseNamingConvention). severity is
# freeform ("low"/"medium"/"high" in ekee's own catalog, not validated by the
# loader itself). retention is "standard" (2 years) or "legal" (7 years) by
# the same convention.
#
# TCNPROFILE.CREATED/UPDATED/DELETED are auto-generated by the interceptor for
# TCNProfile's [Audited(Type = "TCNProfile")] (AuditedAttribute.ActionPrefix
# defaults to Type upper-cased) — still need an entry here or
# ValidateEntityActionsIn fails startup. retention: legal reflects that TCN
# case data is exactly the kind of sensitive record ekee's own catalog treats
# that way (MEMBER.*, OPERATION_DECISION.*) — a policy call for the team to
# confirm, not something to treat as settled.

- code: TCNPROFILE.CREATED
  category: TCN Profile
  severity: high
  requiresTarget: true
  retention: legal

- code: TCNPROFILE.UPDATED
  category: TCN Profile
  severity: medium
  requiresTarget: true
  retention: legal

- code: TCNPROFILE.DELETED
  category: TCN Profile
  severity: high
  requiresTarget: true
  retention: legal
